<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAB Tributário</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho de telas à esquerda + palco que troca de tela com deslize; cada frente tem sua cor */
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel-2:#eef1f8; --ink:#101a33; --ink-2:#4a5878; --line:#d9dfec;
  --blue:#2457e6; --amber:#e08a00; --coral:#e2543c; --teal:#0f9c8c; --violet:#7a4be0; --green:#2f9d4f; --rose:#d13f86;
  --warn:#d98400; --ok:#1f9a55; --crit:#d23b3b;
  --tint:.10;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226; --panel:#111b36; --panel-2:#16224a; --ink:#e8edfb; --ink-2:#97a5c9; --line:#26345e;
  --blue:#5f8bff; --amber:#ffb23f; --coral:#ff7a62; --teal:#33d1bd; --violet:#a888ff; --green:#5dd486; --rose:#ff6fb1;
  --warn:#ffb23f; --ok:#5dd486; --crit:#ff6b6b; --tint:.16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1226; --panel:#111b36; --panel-2:#16224a; --ink:#e8edfb; --ink-2:#97a5c9; --line:#26345e;
  --blue:#5f8bff; --amber:#ffb23f; --coral:#ff7a62; --teal:#33d1bd; --violet:#a888ff; --green:#5dd486; --rose:#ff6fb1;
  --warn:#ffb23f; --ok:#5dd486; --crit:#ff6b6b; --tint:.16; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* trilho */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px 20px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--blue),var(--violet),var(--coral),var(--amber),var(--teal),var(--blue));color:#fff;font:800 13px/1 var(--f-display);letter-spacing:.02em}
.brand b{font:750 16px/1.1 var(--f-display);font-stretch:112%;display:block}
.brand small{color:var(--ink-2);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14px;transition:background .2s,color .2s}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.nav .count{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.theme{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.theme:focus-visible{outline:2px solid var(--blue)}
/* palco */
.stage{position:relative;min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.screen{max-width:1080px;margin:0 auto;animation:entra .55s cubic-bezier(.2,.8,.2,1) both}
.screen.volta{animation-name:entraVolta}
@keyframes entra{from{opacity:0;transform:translateX(56px) scale(.985)}to{opacity:1;transform:none}}
@keyframes entraVolta{from{opacity:0;transform:translateX(-56px) scale(.985)}to{opacity:1;transform:none}}
.screen > *{animation:sobe .6s cubic-bezier(.2,.8,.2,1) both}
.screen > *:nth-child(2){animation-delay:.05s}.screen > *:nth-child(3){animation-delay:.1s}.screen > *:nth-child(4){animation-delay:.15s}.screen > *:nth-child(5){animation-delay:.2s}.screen > *:nth-child(n+6){animation-delay:.25s}
@keyframes sobe{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.screen > *{animation:none!important}}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--blue));display:flex;align-items:center;gap:8px}
h1{font:780 clamp(30px,5vw,50px)/1.02 var(--f-display);font-stretch:118%;letter-spacing:-.01em;margin:12px 0 10px;text-wrap:balance}
h2{font:720 22px/1.15 var(--f-display);font-stretch:110%;margin:0 0 12px;text-wrap:balance}
h3{font:650 16px/1.25 var(--f-body);margin:0}
.lead{font-size:17px;color:var(--ink-2);max-width:64ch;margin:0 0 26px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.tinted{background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--panel));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.click{cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;text-align:left;width:100%}
.click:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -14px color-mix(in srgb,var(--c) 70%,transparent)}
.click:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.section{margin-top:34px}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono)}
.big{font:780 40px/1 var(--f-display);font-stretch:115%;color:var(--c);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) calc(var(--tint)*140%),transparent);color:var(--c);white-space:nowrap}
.pill.warn{--c:var(--warn)}.pill.ok{--c:var(--ok)}.pill.crit{--c:var(--crit)}
.hero{position:relative;border-radius:18px;padding:34px 30px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9;pointer-events:none}
.hero > *:not(canvas){position:relative}
/* fases */
.fase{display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c)}
.fase .n{font:700 13px var(--f-mono);color:var(--c)}
/* fluxo */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lane-title{grid-column:1/-1;margin-top:10px;display:flex;align-items:center;gap:10px}
.step{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 16px;min-height:92px;display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s}
.step:hover{transform:translateY(-3px);border-color:var(--c)}
.step:focus-visible{outline:2px solid var(--c)}
.step::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c)}
.step.dec{border-style:dashed}
.step.main{background:color-mix(in srgb,var(--c) calc(var(--tint)*120%),var(--panel));border-color:var(--c)}
.step small{color:var(--ink-2);font-size:12.5px}
.step .tag{font:500 11px var(--f-mono);color:var(--c)}
.flow-note{font-size:12.5px;color:var(--ink-2)}
/* org */
.org-top{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.org-top .card{width:260px;text-align:center}
.org-link{height:28px;position:relative;margin:0 auto;max-width:760px}
.org-link::before{content:"";position:absolute;left:16%;right:16%;top:50%;border-top:1.5px solid var(--line)}
.role{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.role.open{border:1.5px dashed var(--warn)}
.role span{font-size:12.5px;color:var(--ink-2)}
/* cadência */
.cad{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;position:relative}
.cad .t{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12.5px}
.cad .t b{display:block;font:700 15px var(--f-mono);color:var(--amber)}
.funil{display:flex;flex-wrap:wrap;gap:8px}
.funil span{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.funil span b{font-family:var(--f-mono);color:var(--amber);margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
/* POP */
.pop-head{border-radius:18px;padding:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.meta div{min-width:0}
.meta dt{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.meta dd{margin:2px 0 0;font-weight:500}
.steps{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps > li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:opacity .3s,border-color .3s}
.steps > li::before{content:counter(s);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:700 14px var(--f-mono);color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*150%),transparent)}
.steps > li.feito{opacity:.55;border-color:var(--ok)}
.steps ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}
.steps ul li{margin:3px 0}
.chk{width:22px;height:22px;accent-color:var(--ok);margin-top:4px;cursor:pointer}
.tree td:first-child{width:46%}
.popnav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--c,var(--blue))}
.btn:focus-visible{outline:2px solid var(--blue)}
.note{margin-top:18px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) calc(var(--tint)*100%),var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:14px}
/* teses */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:13px;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*130%),var(--panel))}
.chip:focus-visible{outline:2px solid var(--blue)}
.search{flex:1 1 220px;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.tese{display:flex;flex-direction:column;gap:10px}
.tese .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tese .id{font:600 12px var(--f-mono);color:var(--c)}
.tese dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13.5px}
.tese dt{color:var(--ink-2);font:600 11px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.tese dd{margin:0}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.check li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check{padding:0;margin:0}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.timeline .card{border-top:4px solid var(--c)}
.timeline ul{margin:8px 0 0;padding-left:18px;font-size:14px}
/* menu do celular */
.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar button{all:unset;cursor:pointer;flex:none;display:flex;gap:7px;align-items:center;padding:7px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px}
  .topbar button[aria-current="page"]{border-color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*130%),transparent)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.timeline{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cad{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tese dl{grid-template-columns:1fr}
  .steps > li{grid-template-columns:34px minmax(0,1fr) auto}
}
@media (max-width:440px){.g4{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.hero{padding:24px 18px}}
/* grupos do menu */
.rail{overflow-y:auto}
.nav-g{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);opacity:.7;padding:14px 10px 6px}
.nav-g:first-child{padding-top:0}
.busca-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;margin:0 2px 10px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);font-size:13.5px}
.busca-btn:hover{color:var(--ink);border-color:var(--blue)}
.busca-btn:focus-visible{outline:2px solid var(--blue)}
.busca-btn kbd,.kbd{margin-left:auto;font:500 11px var(--f-mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel)}
/* busca geral */
.sb{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;background:color-mix(in srgb,var(--ink) 35%,transparent);backdrop-filter:blur(3px)}
.sb.aberto{display:flex}
.sb-box{width:min(640px,100%);max-height:72vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);overflow:hidden}
.sb-box input{all:unset;box-sizing:border-box;width:100%;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
.sb-res{overflow-y:auto;padding:6px}
.sb-res button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 12px;border-radius:10px}
.sb-res button:hover,.sb-res button.sel{background:color-mix(in srgb,var(--c) calc(var(--tint)*130%),var(--panel-2))}
.sb-res .k{grid-row:span 2;align-self:center;font:600 11px var(--f-mono);color:var(--c);min-width:62px}
.sb-res .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-res .d{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-vazio{padding:22px;text-align:center;color:var(--ink-2);font-size:14px}
/* kit */
.chain{display:flex;flex-direction:column;gap:0;counter-reset:k}
.elo{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding-bottom:16px}
.elo::before{counter-increment:k;content:counter(k);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--f-mono);color:#fff;background:var(--c);z-index:1}
.elo:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:0;width:2px;background:linear-gradient(var(--c),var(--line))}
.elo .card{display:flex;flex-direction:column;gap:8px}
.elo .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cmd{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 12px;font:13px var(--f-mono);min-width:0}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
.copiar{all:unset;cursor:pointer;flex:none;font:600 11px var(--f-mono);padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.copiar:hover{border-color:var(--blue)}
.copiar:focus-visible{outline:2px solid var(--blue)}
/* avaliador CAPAG */
.cap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.cap-out{position:sticky;top:20px}
.fs{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0;min-inline-size:0}
.fs + .fs{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.fs legend{font:600 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);padding:0;margin-bottom:12px}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo > span{font-size:12.5px;color:var(--ink-2);font-weight:500}
.campo input:not([type=checkbox]),.campo select{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:14px;min-width:0;width:100%}
.campo input:focus,.campo select:focus{outline:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-color:var(--c)}
.full{grid-column:1/-1}
.marca{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.marca input{width:18px;height:18px;accent-color:var(--c);margin-top:2px;flex:none}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.cred{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.cred .marca{font-size:12.5px;align-self:center}
.x{all:unset;cursor:pointer;width:30px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.x:hover{color:var(--crit);background:var(--panel-2)}
.veredito{border-radius:14px;padding:18px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*120%),var(--panel))}
.veredito .v{font:760 21px/1.15 var(--f-display);font-stretch:108%;color:var(--c);margin-top:6px;text-wrap:balance}
.blk{margin-top:16px}
.blk h3{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.blk ul{margin:0;padding-left:18px;font-size:13.5px}
.blk li{margin:5px 0}
.blk li ul{margin-top:4px;color:var(--ink-2)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

  .card,.steps > li,.tbl{break-inside:avoid}
}

<script>
const TESES = /*TESES*/[{"id": "T01", "area": "Remessa à DAU e MS", "titulo": "Remessa RFB para PGFN após 90 dias (MS)", "tese": "Débito declarado e vencido há mais de 90 dias, ainda na RFB, dá direito à remessa para inscrição em DAU, sem depender de edital aberto. Cabe MS para obrigar a remessa.", "quando": "Débito declarado, vencido há mais de 90 dias, sem parcelamento ativo nem exigibilidade suspensa. Requerimento administrativo antes do MS.", "fundamento": "DL 147/1967, art. 22; Portaria MF 447/2018, art. 2º; Lei 13.988/2020, art. 2º, I; Lei 12.016/2009, art. 7º, III", "juris": "TRF4 5052988-32.2022.4.04.7100; TRF4 AG 5000987-93.2023.4.04.0000; TRF3 RemNecCiv 5003096-82.2024.4.03.6108", "modelo": "MODELO MS REMESSA DOS DÉBITOS RFB À PGFN + simples extempo.txt", "status": "verificado", "risco": "Pedido genérico é negado; débito indevido no pedido gera indeferimento. Confirmar vigência da Portaria MF 447/2018."}, {"id": "T02", "area": "Remessa à DAU e MS", "titulo": "Foro do DF no MS (art. 109, §2º, CF)", "tese": "MS pode ser impetrado no DF por foro concorrente do art. 109, §2º, da CF. É opção do impetrante. Se pedir afastar data de corte, a PGFN integra o polo passivo.", "quando": "Domicílio distante de Brasília e prazo de adesão próximo, ou pedido de afastar data de corte. Sem urgência, impetrar no domicílio.", "fundamento": "CF, art. 109, §2º e art. 5º, LXIX; Lei 12.016/2009, art. 2º (define autoridade federal, não foro)", "juris": "STF RE 627.709/DF (Tema 374); STJ CC 172.020; MS 1008865-04.2026.4.01.3400 (8ª Vara Federal DF)", "modelo": "MODELO MS REMESSA DOS DÉBITOS RFB À PGFN + simples extempo.txt", "status": "verificado", "risco": "Precedentes prendem à sede funcional da autoridade; risco de declínio perto do prazo. Teor dos julgados não conferido."}, {"id": "T03", "area": "CAPAG", "titulo": "Pedido de revisão da CAPAG-P pedindo D", "tese": "Capacidade presumida revista a pedido do contribuinte, pelo REGULARIZE, com valor estimado, metodologia e documentos do art. 30. Pede-se classificação D, não faixa intermediária.", "quando": "Classificação A, B ou C com capacidade presumida incompatível com a real; laudo mostra capacidade efetiva abaixo da dívida.", "fundamento": "Port. PGFN 6.757/2022, arts. 21 §2º, 23, 24 IV, 27 a 34, 34-A e 34-B; red. Portarias 1.241/2023 e 1.457/2024", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo - Pedido de Revisão da CAPAG (Mentoria).txt", "status": "verificado", "risco": "Protocolo só pelo REGULARIZE; não suspende cobrança; números da peça têm de bater com o laudo. Corte de 50% não está no art. 24."}, {"id": "T04", "area": "CAPAG", "titulo": "Via 1 (vetor errado) x Via 2 (efetiva)", "tese": "Vetor errado se ataca direto (Via 1). Com contabilidade organizada, a CAPAG efetiva (Via 2), com BP, DRE e DFC pelo método direto, tem resultado mais robusto.", "quando": "Via 1: PGDAS de regime antigo, bem vendido, DOI de operação pontual. Via 2: balanço e DFC dos dois últimos exercícios e do corrente.", "fundamento": "Port. PGFN 6.757/2022, arts. 23, 30 (documentos; DFC pelo método direto) e 32", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo - Pedido de Revisão da CAPAG (Mentoria).txt", "status": "verificado", "risco": "Via 2 leva 60 a 90 dias e depende do contador; DFC indireto gera exigência. Laudo e pedido usam metodologias diferentes."}, {"id": "T05", "area": "CAPAG", "titulo": "Revisão da CAPAG só com ganho de faixa", "tese": "Julgado o pedido de revisão, um novo só cabe com fato superveniente ou mudança substancial da CAPAG presumida. Pedir só após simulação que confirme ganho de faixa com desconto.", "quando": "Antes de qualquer pedido de revisão: comparar presumida, efetiva estimada e edital vigente.", "fundamento": "Port. PGFN 6.757/2022, art. 34-B (incl. Port. 1.241/2023); art. 30 (instrução do pedido)", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo - Pedido de Revisão da CAPAG (Mentoria).txt", "status": "verificado", "risco": "Pedido mal instruído trava a faixa até surgir fato novo. Se a recalculada for maior que a presumida, a revisão piora."}, {"id": "T06", "area": "Entrada e parcelamentos", "titulo": "Entrada indevida (14-A): transação não conta", "tese": "A entrada de 10% ou 20% do art. 14-A só vale para reparcelamento de débito que já esteve em parcelamento. Transação rescindida não conta como histórico.", "quando": "Simulação na PGFN cobra 10% ou 20% após rescisão de transação, em débito que nunca foi parcelado ou foi menos vezes do que o sistema conta.", "fundamento": "Lei 10.522/2002, art. 14-A, caput e §2º (Lei 11.941/2009); Port. PGFN 448/2019, art. 17, §§2º e 3º; CTN, arts. 151, VI, 156, III, 171", "juris": "TRF4 contrário (10% após transação rescindida): número a localizar (LegJur 566.8010.8746.5157)", "modelo": "Modelo - Requerimento da Entrada Indevida (Mentoria).txt", "status": "verificado", "risco": "TRF4 contrário sem número. PGFN invoca art. 3º, §2º da Lei 13.988 e art. 17, §3º da Portaria. Não citar Lei 13.043/2014."}, {"id": "T07", "area": "Entrada e parcelamentos", "titulo": "Separar pedidos por faixa (inscrição inteira)", "tese": "A Portaria 448 aplica a maior faixa ao pedido inteiro se entrar inscrição com histórico de reparcelamento. Formalizar pedidos separados por faixa, sem desmembrar competências.", "quando": "Pedido único que mistura inscrição de 20% com inscrições de 10% ou sem entrada. Testar a separação no portal antes de peticionar.", "fundamento": "Port. PGFN 448/2019, arts. 3º, §1º, 7º e 17, §1º, II", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo - Requerimento da Entrada Indevida (Mentoria).txt", "status": "verificado", "risco": "Portal pode não aceitar adesão direta: a unidade cadastra. Parcelamento da RFB fora do Simples e PGFN especial têm regras (§§2º e 3º)."}, {"id": "T08", "area": "Prescrição e decadência", "titulo": "Prescrição administrativa de 5 anos (CTN 174)", "tese": "Crédito constituído há mais de 5 anos sem causa interruptiva está prescrito. Parcelamento, transação ou confissão reinicia a contagem e pode gerar renúncia.", "quando": "Débito antigo, sem parcelamento ou ação recente, antes de propor qualquer proposta de transação.", "fundamento": "CTN, art. 174 e parágrafo único (I a IV); art. 165 (restituição)", "juris": "Nenhuma citada nas fontes", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "verificado", "risco": "Quem aderiu a parcelamento ou transação em geral renunciou à prescrição. Conferir data de constituição definitiva de cada tributo."}, {"id": "T09", "area": "Prescrição e decadência", "titulo": "Prescrição intercorrente na EF (Tema 566)", "tese": "Na execução fiscal, a intercorrente corre automaticamente após 1 ano de suspensão sem bens, sem despacho. Só citação válida ou constrição efetiva a interrompem.", "quando": "EF com devedor ou bens não localizados, arquivamento provisório, ou bloqueios sem resultado.", "fundamento": "Lei 6.830/1980, art. 40; CTN, art. 174", "juris": "STJ Tema 566 (REsp 1.340.553/RS)", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "verificado", "risco": "Tese do POP sobre exceção de pré-executividade como citação positiva é interpretação não conferida. Ler o inteiro teor."}, {"id": "T10", "area": "Prescrição e decadência", "titulo": "Decadência: art. 150, §4º x 173, I", "tese": "Havendo pagamento ou declaração, 5 anos do fato gerador (art. 150, §4º). Havendo omissão total ou fraude, 5 anos do exercício seguinte (art. 173, I).", "quando": "Auto de infração ou lançamento de ofício sobre tributo por homologação (Simples, PIS, COFINS, ICMS, IRPJ).", "fundamento": "CTN, art. 150, §4º e art. 173, I", "juris": "STJ Tema 163", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "verificado", "risco": "A escolha depende de prova (pagamento, declaração, dolo). POP diz auto nulo de pleno direito: tratar como argumento a confirmar."}, {"id": "T11", "area": "Nulidade da CDA e multas", "titulo": "Nulidade formal da CDA", "tese": "CDA sem os requisitos do art. 202 do CTN e do art. 2º, §5º, da LEF é nula. Conferir nome, domicílio, valor, juros, origem, data e número da inscrição.", "quando": "Ao receber execução fiscal ou analisar DAU, antes de exceção ou embargos.", "fundamento": "CTN, art. 202; Lei 6.830/1980, art. 2º, §5º", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo Parecer Jurídico.txt", "status": "verificado", "risco": "LEF permite substituir ou emendar a CDA até a sentença de primeiro grau (art. 2º, §8º, conferir). Nulidade formal nem sempre extingue."}, {"id": "T12", "area": "Nulidade da CDA e multas", "titulo": "Multa, encargo e juros: temas do STF", "tese": "Conferir na CDA a multa (Tema 214/STF), o encargo do DL 1.025/1969 (Tema 408/STF) e a Selic (Tema 810/STF). Parcela indevida reduz o consolidado e muda a faixa.", "quando": "CDA com multa acima do limite do STF, encargo legal sobre base errada ou juros fora do índice fixado.", "fundamento": "DL 1.025/1969 (encargo legal); temas do STF citados", "juris": "STF Temas 214, 408 e 810", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "verificado", "risco": "Fonte só lista os temas, sem teor. Ler a tese fixada antes de citar o alcance. O limite de 20% é do tema, não de todo encargo."}, {"id": "T13", "area": "Execução fiscal e defesa", "titulo": "EPE sem garantia; embargos com garantia", "tese": "EPE sem garantia só para ordem pública com prova pré-constituída, sem dilação. Embargos exigem garantia integral; anulatória exige depósito do montante integral.", "quando": "EF não garantida: EPE se a tese está em documento já nos autos; embargos se o mérito exige prova e há garantia.", "fundamento": "Lei 6.830/1980, art. 16, §1º (conferir); CTN, art. 151, II (depósito); Súmula 393/STJ (conferir)", "juris": "Súmula 393/STJ (conferir teor); precedente a localizar", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "conferir", "risco": "Art. 16, §1º da LEF e Súmula 393 não estão nas fontes: checar. Sem prova pré-constituída a EPE é indeferida."}, {"id": "T14", "area": "Responsabilidade de sócios", "titulo": "Redirecionamento ao sócio (Súm. 430 e 435)", "tese": "Mero inadimplemento não autoriza redirecionamento ao sócio (Súm. 430/STJ); dissolução irregular autoriza (Súm. 435/STJ). O ônus da prova é da Fazenda (Tema 962/STJ).", "quando": "EF contra Ltda. ativa ou inativa com pedido de inclusão do sócio-administrador no polo passivo.", "fundamento": "CTN, art. 135, III; Súmulas 430, 435 e 392 do STJ", "juris": "STJ Súm. 430 e 435; Súm. 392; Tema 962 (REsp 1.643.944/SP)", "modelo": "POP Analise Passivo Fiscal Federal.txt", "status": "verificado", "risco": "Verificar situação cadastral: dissolução irregular favorece a Fazenda pela Súmula 435. Ato com excesso exige prova."}, {"id": "T15", "area": "Simples Nacional", "titulo": "Débito do Simples fora da Portaria 448", "tese": "Débito do Simples não segue a Portaria 448/2019. Base é o art. 21, §18, da LC 123/2006 e o CGSN, com modalidade própria; transação não é parcelamento para entrada.", "quando": "Cliente do Simples com inscrições a parcelar ou simulação que devolve modalidade indisponível.", "fundamento": "Port. PGFN 448/2019, art. 2º, §2º, II; LC 123/2006, art. 21, §18; Lei 13.988/2020, art. 3º", "juris": "Nenhuma citada nas fontes", "modelo": "Modelo - Requerimento da Entrada Indevida (Mentoria).txt", "status": "verificado", "risco": "Conferir Resolução CGSN 140/2018 antes de citar. POP de análise se contradiz sobre PARCSN rescindido (índice, ponto 4)."}, {"id": "T16", "area": "Simples Nacional", "titulo": "Enquadramento extemporâneo no Simples", "tese": "Dívida retida por omissão ilegal da RFB, regularizada por MS, permitiria pedir enquadramento no Simples com efeitos retroativos. Tese do escritório, sem julgado.", "quando": "Cliente excluído ou em risco de exclusão do Simples por débito, com prazo de 30/09 próximo.", "fundamento": "LC 123/2006, art. 16 (janela de reingresso, via POP); razoabilidade e preservação da empresa", "juris": "Nenhuma nas fontes", "modelo": "MODELO MS REMESSA DOS DÉBITOS RFB À PGFN + simples extempo.txt", "status": "conferir", "risco": "Peça diz 2026 na seção V.1 e 2027 no pedido g. Receita tende a recusar. Usar como pedido subsidiário; conferir art. 16 da LC 123."}, {"id": "T17", "area": "Transação", "titulo": "Impedimento de 2 anos após rescisão", "tese": "Rescisão de transação (qualquer modalidade) veda nova transação por 2 anos da rescisão, inclusive para débitos distintos. Parcelamento convencional rescindido não gera esse impedimento.", "quando": "Rescisão no SISPAR nos últimos 24 meses (aba Ocorrências): transação por adesão e individual bloqueadas.", "fundamento": "Lei 13.988/2020, art. 4º, §4º; Port. PGFN 6.757/2022, arts. 18 e 64, I", "juris": "Nenhuma citada nas fontes", "modelo": "POP Analise Passivo Fiscal Federal.txt; POP_Controle_Negociacoes_RFB_PGFN.txt", "status": "verificado", "risco": "POP de análise contradiz-se sobre PARCSN (seção 6.4 x 10.1). PERT e RELP: caso a caso. Tese de não retroatividade tem baixa chance."}, {"id": "T18", "area": "Transação", "titulo": "Rescisão x cancelamento (duas notificações)", "tese": "Só a rescisão gera impedimento, após duas notificações da PGFN (30 dias para impugnar; 10 para recurso). Cancelamento por parcela não paga não gera impedimento.", "quando": "Parcela atrasada, notificação da PGFN ou 1ª parcela vencida em negociação ativa.", "fundamento": "Edital PGDAU 6/2026, arts. 19 a 22 (conferir); Port. 6.757/2022, art. 18; Port. RFB 555/2025, art. 39", "juris": "Nenhuma citada nas fontes", "modelo": "POP_Controle_Negociacoes_RFB_PGFN.txt", "status": "conferir", "risco": "Prazos e números dos editais mudam: conferir no dia. Pagar só as atrasadas não evita rescisão na 2ª notificação. Avisar o titular."}, {"id": "T19", "area": "Transação", "titulo": "Data de corte e afastamento no MS", "tese": "Edital pode excluir inscrições recentes. A Portaria 6.757 veda edital com crédito inscrito há menos de 90 dias; MS pede afastar a limitação, }

function ordem(id){ const i = TELAS.findIndex(t => t.id === id); if(i>=0) return i*20; const p = POPS.findIndex(p => p.id === id); return p>=0 ? TELAS.findIndex(t => t.id === 'pops')*20 + 1 + p : 0; }

function ir(id){ if(location.hash.slice(1) !== id) location.hash = id; else render(); }

function render(){
  let id = location.hash.slice(1) || 'inicio';
  const valido = TELAS.some(t => t.id === id) || POPS.some(p => p.id === id);
  if(!valido) id = 'inicio';
  const volta = atual !== null && ordem(id) < ordem(atual);
  atual = id;
  const tela = id.startsWith('pop-') ? 'pops' : id;
  document.querySelectorAll('[data-ir]').forEach(b => b.dataset.ir === tela ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  const cor = (TELAS.find(t => t.id === tela) || TELAS[0]).cor;
  const fn = id.startsWith('pop-') ? () => telaPop(POPS.find(p => p.id === id)) : VIEWS[id];
  const stage = $('#stage');
  const pinta = () => {
    stage.innerHTML = `<section class="screen${volta?' volta':''}" style="--c:${cor}">${fn()}</section>`;
    window.scrollTo({top:0});
    depois(id);
  };
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(pinta); else pinta();
}

const AREA_COR = [C.rose,C.violet,C.teal,C.amber,C.blue,C.coral,C.green,C.rose,C.violet];
let filtroArea = 'Todas', filtroTexto = '', filtroStatus = '';
function areas(){ return [...new Set(TESES.map(t=>t.area))]; }
function corArea(a){ const i = areas().indexOf(a); return AREA_COR.at(i % AREA_COR.length) || C.rose; }
function desenhaTeses(){
  const box = $('#lista-teses'); if(!box) return;

  box.innerHTML = l.length ? l.map(t=>`<article class="card tese" style="--c:${corArea(t.area)}"><div class="top"><div><div class="id">${esc(t.id)} · ${esc(t.area)}</div><h3 style="margin-top:4px">${esc(t.titulo)}</h3></div><span class="pill ${t.status==='verificado'?'ok':'warn'}">${t.status==='verificado'?'verificado':'conferir'}</span></div><p style="margin:0">${esc(t.tese)}</p><dl>${[['Quando',t.quando],['Fundamento',t.fundamento],['Jurisprudência',t.juris],['Modelo',t.modelo],['Risco',t.risco]].filter(x=>x[1]).map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></article>`).join('')
    : `<div class="card empty" style="grid-column:1/-1">${TESES.length?'Nenhuma tese com esse filtro.':'O banco de teses ainda está sendo montado.'}</div>`;
}
function desenhaFiltros(){
  const f = $('#filtros'); if(!f) return;
  f.innerHTML = ['Todas',...areas()].map(a=>`<button type="button" class="chip" data-area="${esc(a)}" aria-pressed="${a===filtroArea}" style="--c:${a==='Todas'?C.blue:corArea(a)}">${a==='Todas'?'':'<span class="dot" style="width:8px;height:8px"></span>'}${esc(a)}</button>`).join('') +
   `<button type="button" class="chip" data-status="verificado" aria-pressed="${filtroStatus==='verificado'}" style="--c:var(--ok)">só verificadas</button><input class="search" id="busca" type="search" placeholder="Buscar: CAPAG, prescrição, 14-A…" value="${esc(filtroTexto)}" aria-label="Buscar tese">`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-area]'); if(a){ filtroArea = a.dataset.area; desenhaFiltros(); desenhaTeses(); return; }
  const s = e.target.closest('[data-status]'); if(s){ filtroStatus = filtroStatus ? '' : s.dataset.status; desenhaFiltros(); desenhaTeses(); }
});

document.addEventListener('change', e => {

  if(t.dataset.dec !== undefined){ const v=guarda('decisoes')||[]; v[+t.dataset.dec]=t.checked; guarda('decisoes',v); }

/* ---------- avaliador da CAPAG (porta de capag/avaliar_capag.py) ---------- */
const SITUACOES_D = ['BAIXADA','BAIXADO','INAPTA','INAPTO','SUSPENSA','SUSPENSO'];
const num = v => { if(v===null||v===undefined||v==='') return null; if(typeof v==='number') return v; const s = String(v).replace(/[R$\s]/g,''); const n = Number(s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s.replace(/\.(?=\d{3}(\D|$))/g,'')); return isFinite(n) ? n : null; };
const dt = s => { if(!s) return null; let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s) || null; if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]); m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); return m ? Date.UTC(+m[3],+m[2]-1,+m[1]) : null; };
const hojeUTC = () => { const h = new Date(); return Date.UTC(h.getFullYear(),h.getMonth(),h.getDate()); };
const dias = (a,b) => Math.round((b-a)/864e5);
const anos = (a,b) => dias(a,b)/365.25;
const brl = v => 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy = t => new Date(t).toLocaleDateString('pt-BR',{timeZone:'UTC'});
const pct = v => Math.round(v);

function avaliarCapag(c, hoje = hojeUTC()){
  const out=[], travas=[], alertas=[], aFavor=[];
  const ciencia = dt(c.data_ciencia_capag);
  if(ciencia!==null){
    const restam = 30 - dias(ciencia, hoje);
    if(restam < 0) travas.push(`Prazo do art. 29 vencido há ${-restam} dias (30 dias da ciência em ${dmy(ciencia)}). Conferir se houve nova ciência (nova proposta ou edital) antes de desistir.`);
    else if(restam <= 7) alertas.push(`Restam ${restam} dias do prazo do art. 29. Protocolo só pelo Regularize (art. 30).`);
    else out.push(`Prazo do art. 29: restam ${restam} dias.`);
  } else alertas.push('Data de ciência da CAPAG não informada: o prazo do art. 29 (30 dias) não foi conferido.');

  if(c.pedido_anterior_julgado){
    const fato = (c.fato_superveniente||'').trim();
    if(fato) alertas.push(`Já houve pedido julgado. Novo pedido só com fato superveniente (art. 34-B, § 1º). Fato alegado: "${fato}". O pedido precisa demonstrar como ele altera a capacidade.`);
    else if(c.mudanca_substancial_presumida) alertas.push('Já houve pedido julgado; a mudança substancial da CAPAG presumida autoriza novo pedido (art. 34-B, § 2º). Guardar o print da presumida anterior e da atual.');
    else travas.push('Já houve pedido julgado e não há fato superveniente nem mudança substancial da presumida: novo pedido não cabe (art. 34-B).');
  }

  const presumida = num(c.capag_presumida_valor) || 0, passivo = num(c.passivo_total) || 0;
  const fluxos = (c.fluxo_caixa_livre_anual||[]).map(num).filter(x => x!==null);
  let estimada = num(c.capacidade_estimada_5anos);
  if(estimada===null && fluxos.length){
    estimada = fluxos.reduce((a,b)=>a+b,0)/fluxos.length*5;
    out.push(`Capacidade estimada = média do fluxo de caixa livre (${fluxos.map(brl).join(', ')}) × 5 anos = ${brl(estimada)}.`);
  }
  if(presumida && passivo) out.push(`CAPAG presumida: ${brl(presumida)}, ou ${pct(presumida/passivo*100)}% do passivo total de ${brl(passivo)}.`);
  if(estimada!==null && presumida){
    const dif = (presumida-estimada)/presumida*100;
    if(estimada >= presumida) travas.push(`A capacidade estimada (${brl(estimada)}) é IGUAL OU MAIOR que a presumida (${brl(presumida)}). A revisão pode piorar a classificação: não pedir.`);
    else if(dif < 15) alertas.push(`A estimada (${brl(estimada)}) é só ${pct(dif)}% menor que a presumida. Ganho incerto: confirmar no Regularize, com simulação, se essa diferença muda a faixa antes de pedir.`);
    else aFavor.push(`A estimada (${brl(estimada)}) é ${pct(dif)}% menor que a presumida (${brl(presumida)}).`);
  } else if(estimada===null) alertas.push('Sem capacidade estimada (laudo ou fluxo de caixa): não dá para saber se a revisão ajuda.');
  if(estimada!==null && passivo && estimada >= passivo) travas.push('A capacidade estimada paga o passivo inteiro em 5 anos (art. 21). Nesse cenário a tendência é crédito de alta recuperação (sem desconto); a revisão não ajuda.');

  const faixa = (c.faixa_atual||'').toUpperCase().trim();
  if(faixa==='D') travas.push('A faixa atual já é D: não há faixa melhor para buscar com a revisão.');
  else if(faixa==='A'||faixa==='B') aFavor.push(`Faixa atual ${faixa} não tem desconto, só entrada facilitada. O desconto está em C e D.`);
  else if(faixa==='C') out.push('Faixa atual C: já há desconto. Revisão só se a estimada indicar D com folga.');

  const sit = (c.situacao_cadastral||'').toUpperCase();
  if(c.recuperacao_judicial || c.falencia) aFavor.push('Recuperação judicial ou falência: os créditos são irrecuperáveis pelo art. 25, III, sem revisão. Conferir se a situação consta no CNPJ (parágrafo único).');
  if(SITUACOES_D.some(s => sit.includes(s))) alertas.push(`Situação cadastral "${sit}": conferir se está na lista do art. 25, IV.`);
  const tipoD = [];
  (c.creditos||[]).forEach(cr => {
    let motivo = null;
    const di = dt(cr.data_inscricao); if(di!==null && anos(di,hoje) > 15 && !cr.garantia_ou_suspensao) motivo = `inscrito há ${Math.round(anos(di,hoje))} anos, sem garantia nem suspensão (art. 25, I)`;
    const sj = dt(cr.suspensa_judicial_desde); if(sj!==null && anos(sj,hoje) > 10) motivo = `suspenso por decisão judicial há ${Math.round(anos(sj,hoje))} anos (art. 25, II)`;
    const a40 = dt(cr.execucao_arquivada_art40_desde); if(a40!==null && anos(a40,hoje) > 3) motivo = `execução arquivada pelo art. 40 da LEF há ${Math.round(anos(a40,hoje))} anos (art. 25, VI)`;
    if(motivo) tipoD.push(`${cr.inscricao||'?'}: ${motivo}`);
  });
  if(tipoD.length) aFavor.push({t:'Créditos que já são irrecuperáveis (tipo D) sem revisão. Conferir se o Regularize já os classifica assim; se não, isso vai no pedido:', sub:tipoD});

  const docs = c.documentos || {};
  const faltam = DOCS.filter(([k]) => !docs[k]).map(([,t,b]) => `${t} (${b})`);
  if(faltam.length) alertas.push({t:`Faltam ${faltam.length} documentos do art. 30. Sem eles a PGFN dá 10 dias para sanar e, se não vierem, não conhece o pedido (art. 31, § 1º):`, sub:faltam});
  if((c.dfc_metodo||'').toLowerCase().startsWith('indir')) alertas.push('DFC pelo método INDIRETO: na prática gera despacho de exigência. Refazer pelo método direto.');

  let veredito, tom;
  if(travas.length){ veredito='Não pedir a revisão agora'; tom='crit'; }
  else if(estimada===null || presumida===0 || faltam.length > 3){ veredito='Falta dado para decidir'; tom='warn'; }
  else if(aFavor.length){ veredito='Revisão recomendada, depois de confirmar o ganho de faixa no Regularize'; tom='ok'; }
  else { veredito='Revisão possível, ganho não demonstrado'; tom='warn'; }
  return {veredito, tom, travas, alertas, aFavor, out};
}
const itemTxt = i => typeof i==='string' ? i : i.t + '\n' + i.sub.map(s=>'    - '+s).join('\n');
function relatorioCapag(c){
  const r = avaliarCapag(c), L = [`# Avaliação da CAPAG: ${c.empresa||'empresa'}`, '', `CNPJ ${c.cnpj||'[CONFERIR]'} · avaliado em ${dmy(hojeUTC())}`, '', '## Veredito', '', `**${r.veredito.toUpperCase()}**`];
  [['Travas',r.travas],['A favor da revisão',r.aFavor],['Alertas',r.alertas],['Números e prazos',r.out]].forEach(([t,it]) => { if(it.length) L.push('', '## '+t, '', ...it.map(i=>'- '+itemTxt(i))); });
  L.push('', '## Limites desta avaliação', '', '- A faixa A/B/C/D não foi calculada: a fórmula da PGFN não é pública. Ela sai do Regularize.', '- Edital, desconto, entrada e prazo: conferir no Regularize no dia.', '- Base: Portaria PGFN 6.757/2022, arts. 21 a 34-B (texto em `leis/`, `python leis/buscar_lei.py PORT6757 30`).', '- Julgado o pedido, cabe recurso em 10 dias pelo Regularize (art. 34-A).', '', 'Minuta automática para revisão do advogado responsável.');
  return L.join('\n');
}
function credLinha(cr={}, i){
  return `<div class="cred" data-cred="${i}">
    <label class="campo"><span>Inscrição</span><input data-c="inscricao" value="${esc(cr.inscricao||'')}" placeholder="80 6 09 000001-01"></label>
    <label class="campo"><span>Inscrita em</span><input type="date" data-c="data_inscricao" value="${esc(cr.data_inscricao||'')}"></label>
    <label class="campo"><span>Suspensa por juiz desde</span><input type="date" data-c="suspensa_judicial_desde" value="${esc(cr.suspensa_judicial_desde||'')}"></label>
    <label class="campo"><span>Arquivada (art. 40) desde</span><input type="date" data-c="execucao_arquivada_art40_desde" value="${esc(cr.execucao_arquivada_art40_desde||'')}"></label>
    <button class="x" type="button" data-cred-del="${i}" aria-label="Tirar esta inscrição"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <label class="marca full"><input type="checkbox" data-c="garantia_ou_suspensao" ${cr.garantia_ou_suspensao?'checked':''}>Tem garantia ou exigibilidade suspensa</label>
  </div>`;
}
function lerCaso(){
  const f = $('#cap-form'); if(!f) return null; const v = n => f.elements[n];
  const c = {empresa:v('empresa').value.trim(), cnpj:v('cnpj').value.trim(), faixa_atual:v('faixa_atual').value,
    capag_presumida_valor:num(v('capag_presumida_valor').value), data_ciencia_capag:v('data_ciencia_capag').value,
    passivo_total:num(v('passivo_total').value), fluxo_caixa_livre_anual:['fc0','fc1','fc2'].map(n=>num(v(n).value)).filter(x=>x!==null),
    capacidade_estimada_5anos:num(v('capacidade_estimada_5anos').value), pedido_anterior_julgado:v('pedido_anterior_julgado').checked,
    fato_superveniente:v('fato_superveniente').value, mudanca_substancial_presumida:v('mudanca_substancial_presumida').checked,
    dfc_metodo:v('dfc_metodo').value, situacao_cadastral:v('situacao_cadastral').value, recuperacao_judicial:v('recuperacao_judicial').checked, falencia:v('falencia').checked,
    documentos:Object.fromEntries(DOCS.map(([k])=>[k, v('doc_'+k).checked])), creditos:[]};
  f.querySelectorAll('[data-cred]').forEach(row => { const cr = {}; row.querySelectorAll('[data-c]').forEach(i => { cr[i.dataset.c] = i.type==='checkbox' ? i.checked : i.value.trim(); }); if(cr.inscricao || cr.data_inscricao || cr.suspensa_judicial_desde || cr.execucao_arquivada_art40_desde) c.creditos.push(cr); });
  return c;
}
const fmtNum = n => n===null||n===undefined||n==='' ? '' : Number(n).toLocaleString('pt-BR');
function preencherCaso(c){
  const f = $('#cap-form'); if(!f) return; const v = n => f.elements[n];
  ['empresa','cnpj','data_ciencia_capag','fato_superveniente'].forEach(n => v(n).value = c[n]||'');
  v('faixa_atual').value = c.faixa_atual||''; v('dfc_metodo').value = c.dfc_metodo||''; v('situacao_cadastral').value = c.situacao_cadastral||'ATIVA';
  ['capag_presumida_valor','passivo_total','capacidade_estimada_5anos'].forEach(n => v(n).value = fmtNum(c[n]));
  ['fc0','fc1','fc2'].forEach((n,i) => v(n).value = fmtNum((c.fluxo_caixa_livre_anual||[])[i]));
  ['pedido_anterior_julgado','mudanca_substancial_presumida','recuperacao_judicial','falencia'].forEach(n => v(n).checked = !!c[n]);
  DOCS.forEach(([k]) => v('doc_'+k).checked = !!(c.documentos||{})[k]);
  const cr = (c.creditos && c.creditos.length) ? c.creditos : [{}];
  $('#cap-creds').innerHTML = cr.map(credLinha).join('');
}
function desenhaCap(){
  const box = $('#cap-out'); if(!box) return;
  const c = lerCaso(); guarda('capag:caso', c);
  $('#cap-34b').style.display = c.pedido_anterior_julgado ? '' : 'none';
  const r = avaliarCapag(c);
  const li = i => typeof i==='string' ? `<li>${esc(i)}</li>` : `<li>${esc(i.t)}<ul>${i.sub.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></li>`;
  const bloco = (t,it,cl) => it.length ? `<div class="blk"><h3><span class="dot" style="--c:var(--${cl})"></span>${t} <span class="muted mono" style="font-weight:500">${it.length}</span></h3><ul>${it.map(li).join('')}</ul></div>` : '';
  box.innerHTML = `<div class="veredito" style="--c:var(--${r.tom})"><div class="eyebrow" style="--c:var(--${r.tom})">Veredito${c.empresa?' · '+esc(c.empresa):''}</div><div class="v">${esc(r.veredito)}</div></div>
    <div class="card" style="margin-top:12px">${bloco('Travas',r.travas,'crit')}${bloco('A favor da revisão',r.aFavor,'ok')}${bloco('Alertas',r.alertas,'warn')}${bloco('Números e prazos',r.out,'blue')}
      <p class="muted" style="font-size:12.5px;margin:16px 0 0">A faixa A/B/C/D sai do Regularize. Edital, desconto, entrada e prazo: conferir no dia. Julgado o pedido, cabe recurso em 10 dias (art. 34-A).</p>
      <div class="acoes"><button class="btn" type="button" data-cap="copiar">Copiar o relatório</button><button class="btn" type="button" data-cap="json">Baixar caso.json</button><button class="btn" type="button" data-cap="imprimir">Imprimir</button></div></div>`;
}
function iniciaCap(){ const salvo = guarda('capag:caso'); preencherCaso(salvo || {}); desenhaCap(); }

/* ---------- busca geral ---------- */
function indice(){
  const it = [];
  TELAS.forEach(t => it.push({k:'TELA', c:t.cor, t:t.nome, d:'', ir:t.id}));
  POPS.forEach(p => it.push({k:'POP-'+p.cod, c:p.cor, t:p.nome, d:p.executa+' · '+p.tempo, ir:p.id, txt:JSON.stringify(p.passos)+(p.nota||'')+JSON.stringify(p.arvore||'')}));
  TESES.forEach(t => it.push({k:t.id, c:C.rose, t:t.titulo, d:t.area, ir:'teses', tese:t.id, txt:t.tese+t.fundamento+t.quando+t.juris}));
  LEIS.forEach(l => it.push({k:l.sigla, c:C.violet, t:l.nome, d:l.uso, ir:'leis', lei:l.sigla}));
  KIT.forEach(k => it.push({k:'KIT', c:k.cor, t:k.nome, d:k.pasta, ir:'kit', txt:k.d+k.cmd.join(' ')}));
  DECISOES.forEach(d => it.push({k:'DECISÃO', c:C.blue, t:d, d:'', ir:'decisoes'}));
  return it.map(x => ({...x, s:semAcento([x.k,x.t,x.d,x.txt].join(' '))}));
}
let IDX = null, sbSel = 0, sbLista = [];
function abreBusca(){ IDX = IDX || indice(); $('#sb').classList.add('aberto'); const q = $('#sb-q'); q.value=''; desenhaBusca(); q.focus(); }
function fechaBusca(){ $('#sb').classList.remove('aberto'); }
function desenhaBusca(){
  const termos = semAcento($('#sb-q').value).split(/\s+/).filter(Boolean);
  sbLista = (termos.length ? IDX.filter(x => termos.every(t => x.s.includes(t))) : IDX.filter(x => x.k==='TELA')).slice(0,30);
  sbSel = 0;
  $('#sb-res').innerHTML = sbLista.length ? sbLista.map((x,i)=>`<button type="button" role="option" data-sb="${i}" class="${i?'':'sel'}" style="--c:${x.c}"><span class="k">${esc(x.k)}</span><span class="t">${esc(x.t)}</span><span class="d">${esc(x.d)}</span></button>`).join('') : '<div class="sb-vazio">Nada encontrado. Tente outra palavra.</div>';
}
function escolhe(i){
  const x = sbLista[i]; if(!x) return; fechaBusca();
  if(x.tese){ filtroArea='Todas'; filtroStatus=''; filtroTexto=x.tese; }
  if(x.lei) filtroLei = x.lei;
  if(location.hash.slice(1)===x.ir) render(); else ir(x.ir);
}
function marcaSel(){ $('#sb-res').querySelectorAll('[data-sb]').forEach((b,i)=>{ b.classList.toggle('sel', i===sbSel); if(i===sbSel) b.scrollIntoView({block:'nearest'}); }); }
$('#sb-q').addEventListener('input', desenhaBusca);
$('#sb-q').addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); sbSel = Math.min(sbSel+1, sbLista.length-1); marcaSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sbSel = Math.max(sbSel-1, 0); marcaSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); escolhe(sbSel); }
});
$('#sb').addEventListener('click', e => { if(e.target.id==='sb') fechaBusca(); });
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#sb').classList.contains('aberto') ? fechaBusca() : abreBusca(); }
  else if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); abreBusca(); }
  else if(e.key==='Escape' && $('#sb').classList.contains('aberto')) fechaBusca();
});

document.addEventListener('click', e => {
  if(e.target.closest('[data-busca]')){ abreBusca(); return; }
  const sb = e.target.closest('[data-sb]'); if(sb){ escolhe(+sb.dataset.sb); return; }
  const cp = e.target.closest('[data-copiar]'); if(cp){ copiar(cp.dataset.copiar); return; }
  if(e.target.closest('[data-cred-add]')){ const box=$('#cap-creds'); box.insertAdjacentHTML('beforeend', credLinha({}, box.children.length)); box.lastElementChild.querySelector('input').focus(); return; }
  const del = e.target.closest('[data-cred-del]'); if(del){ del.closest('.cred').remove(); if(!$('#cap-creds').children.length) $('#cap-creds').innerHTML = credLinha({},0); desenhaCap(); return; }
  const a = e.target.closest('[data-cap]'); if(!a) return;
  const acao = a.dataset.cap;
  if(acao==='exemplo'){ preencherCaso(EXEMPLO_CAPAG); desenhaCap(); toast('Caso de exemplo carregado'); }
  if(acao==='limpar'){ preencherCaso({}); desenhaCap(); }
  if(acao==='copiar') copiar(relatorioCapag(lerCaso()));
  if(acao==='imprimir') print();
  if(acao==='json'){ const c = lerCaso(); const b = new Blob([JSON.stringify(c,null,2)],{type:'application/json'}); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href=u; l.download='caso.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast('caso.json baixado: rode capag/avaliar_capag.py caso.json'); }
});
document.addEventListener('input', e => {
  if(e.target.id==='busca-lei'){ filtroLei = e.target.value; desenhaLeis(); }
  if(e.target.closest('#cap-form')) desenhaCap();
});
document.addEventListener('change', e => { if(e.target.closest('#cap-form')) desenhaCap(); });

function ondas(){
  const cv = $('#ondas'); if(!cv) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio||1);
  const cores = ['--blue','--violet','--coral','--amber','--teal'].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = performance.now();
  function frame(now){
    if(!document.body.contains(cv)) return;
    const w = cv.clientWidth, h = cv.clientHeight; if(cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const t = quieto ? 0 : (now - t0)/1000;
    cores.forEach((c,i)=>{
      ctx.beginPath(); ctx.lineWidth = 1.6; ctx.strokeStyle = c; ctx.globalAlpha = .45;
      for(let x=0;x<=w;x+=8){ const y = h*.72 + Math.sin(x/(120+i*28) + t*(.5+i*.12) + i) * (18+i*7) - i*14; x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    if(!quieto) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function depois(id){ if(id==='inicio') ondas(); if(id==='teses'){ desenhaFiltros(); desenhaTeses(); } if(id==='leis') desenhaLeis(); if(id==='capag') iniciaCap(); $('#stage').focus({preventScroll:true}); }

$('#tema').addEventListener('click', () => {
  const r = document.documentElement, escuro = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = escuro ? 'light' : 'dark'; guarda('tema', r.dataset.theme); if(atual==='inicio') ondas();
});
(() => { const t = guarda('tema'); if(t) document.documentElement.dataset.theme = t; })();
navegar(); render();
